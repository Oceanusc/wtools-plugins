<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>网页快开</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./model.js" defer></script>
  <script src="./index.js" defer></script>
</head>
<body>
  <nav class="tabs" aria-label="快开类型"><button id="web-tab" aria-pressed="true">▦　网页快开</button><button id="ai-tab" aria-pressed="false">➤　AI 快开</button><span id="total"></span><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="查找名称或网址…" aria-label="查找网页"></label></nav>
  <div class="workspace"><aside id="sidebar"><div class="section-label">我的分类</div><div id="categories"></div><div class="category-tools"><button id="add-category" title="新增分类">＋ 新分类</button><button id="edit-category" title="重命名分类" aria-label="重命名分类">✎</button><button id="delete-category" title="删除分类" aria-label="删除分类">⌫</button></div><div class="section-label">内置</div><button id="builtin">常用网站 <span>↗</span></button></aside>
  <main><div class="list-heading"><div><h2 id="category-title">默认分类</h2><p id="category-hint"></p></div><button id="open-category" class="subtle">↗ 打开此分类</button></div><div id="entries"></div><div id="empty" hidden><span>◇</span><h3>从一个常用网页开始</h3><p>添加网址，也可以把多个网页组合为一个入口。</p><button id="empty-add" class="primary">＋ 新增网页快开</button></div></main></div>
  <footer><label id="category-launch-label" class="launch-setting"><input id="category-launch" type="checkbox" role="switch"><span>开启分类启动<small>在启动器中一键打开此分类</small></span></label><span id="ai-note" hidden>直接打开 AI 网站，可为每个入口指定浏览器</span><button id="add-entry" class="primary">＋ 新增网页快开</button></footer>
  <p id="status" role="status" aria-live="polite"></p>
  <dialog id="editor"><form id="entry-form"><div class="dialog-title"><h2 id="editor-title">新增网页快开</h2><button type="button" data-close="editor" aria-label="关闭">×</button></div><label>名称<input id="entry-name" required maxlength="60" placeholder="例如：工作台"></label><label>分类<select id="entry-category"></select></label><div class="field-heading">网页与浏览器 <small>一个入口可以打开多个网页</small></div><div id="url-fields"></div><button id="add-url" type="button" class="subtle">＋ 添加一个网页</button><label class="inline"><input id="entry-enabled" type="checkbox" checked>启用此入口（参与搜索与批量启动）</label><p id="editor-error" class="error" role="alert"></p><div class="dialog-actions"><button id="delete-entry" type="button" class="danger">删除入口</button><button type="button" data-close="editor">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
  <dialog id="category-dialog"><form id="category-form"><h2 id="category-dialog-title">新增分类</h2><label>分类名称<input id="category-name" required maxlength="30"></label><p id="category-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="category-dialog">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
  <dialog id="confirm-dialog"><h2>删除分类</h2><p>该分类中的网页会移到「默认分类」，不会删除网页。</p><div class="dialog-actions"><button data-close="confirm-dialog">取消</button><button id="confirm-delete-category" class="danger">删除分类</button></div></dialog>
</body></html>
