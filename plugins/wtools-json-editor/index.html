<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-wtools-json-filter'; style-src 'self' 'unsafe-inline'; frame-src 'self'; worker-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>JSON 编辑器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="toolbar" aria-label="JSON 操作">
    <div class="tool-group"><button id="format" class="primary" title="Ctrl+Shift+F">格式化</button><button data-action="minify">压缩</button><button data-action="escape">转义</button><button data-action="unescape">反转义</button></div>
    <span class="divider"></span><div class="tool-group"><button data-action="xml">XML</button><button data-action="typescript">TS</button></div>
    <span class="divider"></span><div class="tool-group"><button id="example">示例</button><button id="open">打开文件</button><input id="file" type="file" accept=".json,.yaml,.yml,.xml,.txt" hidden></div>
    <div class="toolbar-end"><label class="auto-label"><input type="checkbox" id="auto" checked>自动转换</label><select id="indent" aria-label="缩进"><option value="2">2 空格</option><option value="4">4 空格</option><option value="tab">Tab</option></select></div>
  </nav>
  <main class="workspace">
    <section class="pane source-pane" aria-label="输入数据">
      <div class="pane-header"><div><span class="pane-dot"></span><strong>源数据</strong><span class="tag" id="source-type">JSON</span></div><div class="pane-actions"><button id="search" title="搜索源数据 Ctrl+F" aria-label="搜索源数据">⌕</button><button id="clear" title="清空源数据" aria-label="清空源数据">清空</button></div></div>
      <div id="source" class="editor"></div>
      <div class="pane-footer"><span id="source-status">准备就绪</span><span id="source-size"></span></div>
    </section>
    <div class="split-handle" role="separator" aria-label="调整双栏宽度" aria-orientation="vertical" tabindex="0"><span>⋮</span></div>
    <section class="pane result-pane" aria-label="输出结果">
      <div class="pane-header"><div><span class="pane-dot result-dot"></span><strong>处理结果</strong><span class="tag" id="result-type">JSON</span></div><div class="pane-actions"><button id="use-result" title="将结果替换源数据">用作输入</button><button id="copy" title="复制结果">复制</button><button id="download" title="下载结果" aria-label="下载结果">↓</button></div></div>
      <div id="result" class="editor"></div>
      <div class="pane-footer"><span id="result-status">格式化后的数据将在这里显示</span><span id="result-size"></span></div>
    </section>
  </main>
  <section class="filter-panel" aria-label="JavaScript 数据过滤">
    <div class="filter-input"><span class="js-icon">this</span><input id="expression" aria-label="JavaScript 过滤表达式" spellcheck="false" placeholder="JS 过滤；示例 .items.filter(x => x.active)"><span id="run-status" class="run-status"></span><button id="run" class="primary">运行</button><button id="help" aria-expanded="false" title="语法帮助">?</button></div>
    <div id="help-content" hidden><p><code>this</code> 或 <code>data</code> 代表整个 JSON。输入表达式后按 Ctrl+Enter 运行。</p><div class="examples"><button data-expression="Object.keys(this)">获取所有键</button><button data-expression="Object.values(this)">获取所有值</button><button data-expression="this.items.filter(x => x.active).map(x => x.name)">筛选示例数据</button></div></div>
  </section>
  <div id="message" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
