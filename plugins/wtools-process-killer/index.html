<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>进程与端口管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="tabs" role="group" aria-label="进程范围">
      <button id="all" type="button" aria-pressed="true">全部进程</button>
      <button id="with-ports" type="button" aria-pressed="false">有端口</button>
    </div>
    <label class="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <span class="sr-only">搜索进程、PID 或端口</span>
      <input id="search" type="search" placeholder="搜索进程名、PID 或端口…" autocomplete="off">
    </label>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="auto-refresh"> 自动刷新</label>
      <button id="refresh" type="button" class="button">刷新</button>
    </div>
  </header>

  <div class="workspace">
    <main class="list-wrap" aria-label="进程列表">
      <ul id="rows" class="proc-list" role="listbox" aria-label="进程列表"></ul>
      <p id="empty" class="empty" role="status" hidden></p>
    </main>

    <aside id="details-drawer" class="drawer" aria-labelledby="detail-name" hidden>
      <div class="drawer-header">
        <div class="drawer-title">
          <div id="detail-icon" class="proc-icon" aria-hidden="true"></div>
          <div class="drawer-name-wrap">
            <h2 id="detail-name"></h2>
            <span id="detail-subtitle" class="drawer-subtitle"></span>
          </div>
        </div>
        <button id="dismiss" type="button" class="icon-btn" title="收起详情 (Esc)" aria-label="关闭详情">›</button>
      </div>

      <div class="drawer-body">
        <div class="meta-block">
          <span class="meta-label">进程</span>
          <div class="meta-pills"><span id="detail-pid" class="pill accent"></span></div>
        </div>
        <div class="meta-block">
          <span class="meta-label">占用内存</span>
          <div class="meta-pills" id="detail-metrics"></div>
        </div>
        <div class="meta-block" id="detail-ports-block" hidden>
          <span class="meta-label">监听端口</span>
          <div id="detail-ports" class="meta-pills"></div>
        </div>
        <div class="meta-block cmd-block">
          <div class="meta-head">
            <span class="meta-label">命令行</span>
            <button id="copy-cmd" type="button" class="mini-btn" title="复制命令行">复制</button>
          </div>
          <pre id="detail-command"></pre>
        </div>
      </div>

      <p id="detail-status" class="detail-status" role="status" aria-live="polite"></p>

      <div class="drawer-actions">
        <button id="copy-path" type="button" class="action-row">
          <span class="action-icon" aria-hidden="true">⧉</span>
          <span class="action-label">复制进程路径</span>
          <kbd>Ctrl P</kbd>
        </button>
        <button id="show-file" type="button" class="action-row">
          <span class="action-icon" aria-hidden="true">↗</span>
          <span class="action-label">在文件管理器显示</span>
          <kbd>Ctrl E</kbd>
        </button>
        <button id="restart" type="button" class="action-row danger-row">
          <span class="action-icon" aria-hidden="true">↻</span>
          <span class="action-label">重启进程</span>
          <kbd>Ctrl R</kbd>
        </button>
        <button id="stop" type="button" class="action-row danger-row">
          <span class="action-icon" aria-hidden="true">✕</span>
          <span class="action-label">关闭进程</span>
          <kbd>Del</kbd>
        </button>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <div class="footer-left">
      <span id="count"></span>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span id="status" role="status"></span>
    </div>
    <div class="sort-bar" role="group" aria-label="排序方式">
      <button type="button" data-sort="name">名称<span class="sort-arrow" aria-hidden="true"></span></button>
      <button type="button" data-sort="ports">端口<span class="sort-arrow" aria-hidden="true"></span></button>
      <button type="button" data-sort="mem">内存<span class="sort-arrow" aria-hidden="true"></span></button>
      <button type="button" data-sort="cpu" class="cpu">CPU<span class="sort-arrow" aria-hidden="true"></span></button>
    </div>
  </footer>

  <dialog id="kill-dialog" aria-labelledby="kill-title">
    <div class="kill-header">
      <div id="kill-icon" class="proc-icon" aria-hidden="true"></div>
      <div class="kill-title-wrap">
        <h3 id="kill-title"></h3>
        <p id="kill-pid"></p>
      </div>
    </div>
    <p id="kill-message" class="kill-message"></p>
    <p id="kill-path" class="kill-path"></p>
    <p id="kill-error" class="kill-error" role="status" hidden></p>
    <div class="kill-actions">
      <button id="kill-details" type="button" class="button">查看详情</button>
      <div class="kill-right">
        <button id="cancel-action" type="button" class="button">取消</button>
        <button id="apply-action" type="button" class="button danger-solid">确认关闭</button>
      </div>
    </div>
  </dialog>
</body>
</html>
