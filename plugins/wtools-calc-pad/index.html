<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算稿纸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <main class="main-pane">
      <div id="rows-list" class="rows-list" role="list" aria-label="计算过程列表"></div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <footer class="bottom-bar" aria-label="稿纸工具栏">
        <button id="btn-theme" class="tool-btn" type="button" title="切换主题（跟随系统 / 浅色 / 深色）" aria-label="切换主题">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
          </svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button id="btn-lock" class="tool-btn" type="button" title="锁定/解锁当前稿纸" aria-label="锁定当前稿纸" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button id="btn-clear" class="tool-btn" type="button" title="清空当前稿纸 (Ctrl+R)" aria-label="清空当前稿纸">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button id="btn-note" class="tool-btn" type="button" title="为当前行添加备注 (Ctrl+B)" aria-label="添加备注">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button id="btn-copy-all" class="tool-btn" type="button" title="复制整张稿纸过程" aria-label="复制整张稿纸">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button id="btn-help" class="tool-btn" type="button" title="快捷键说明" aria-label="快捷键说明" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </button>
      </footer>
    </main>

    <aside id="sidebar" class="sidebar" aria-label="历史稿纸">
      <div id="sheet-list" class="sheet-list" role="listbox" aria-label="稿纸列表"></div>
      <div class="sidebar-footer">
        <button id="btn-new-sheet" class="new-sheet-btn" type="button" title="新建稿纸 (Ctrl+N)">
          <span aria-hidden="true">+</span> 新稿纸
        </button>
        <button id="btn-sidebar-toggle" class="sidebar-toggle-btn" type="button" title="收起/展开侧边栏" aria-label="切换侧边栏">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/>
          </svg>
        </button>
      </div>
    </aside>

    <button id="btn-sidebar-float" class="sidebar-float-btn" type="button" title="展开稿纸历史" aria-label="展开稿纸历史" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/>
      </svg>
    </button>

    <div id="help-popover" class="help-popover" hidden role="dialog" aria-label="快捷键说明">
      <div class="help-header">
        <span>快捷键与公式支持</span>
        <button id="btn-help-close" class="help-close" type="button" aria-label="关闭">×</button>
      </div>
      <ul class="help-list">
        <li><kbd>Enter</kbd><span>将当前结果带入下一行继续计算</span></li>
        <li><kbd>↑</kbd> / <kbd>↓</kbd><span>快速切换计算行</span></li>
        <li><kbd>Ctrl/Cmd + C</kbd><span>未选中文本时复制当前结果</span></li>
        <li><kbd>Ctrl/Cmd + B</kbd><span>为当前计算添加或编辑备注</span></li>
        <li><kbd>Ctrl/Cmd + N</kbd><span>新建一张稿纸</span></li>
        <li><kbd>Ctrl/Cmd + R</kbd><span>清空当前稿纸</span></li>
      </ul>
      <div class="help-funcs">
        支持 <code>+ - * × x / ^ %</code>、括号、千分位逗号、常量 <code>pi</code> <code>e</code> 及函数 <code>sqrt</code> <code>abs</code> <code>round</code> <code>sin</code> <code>cos</code> <code>log</code> <code>ln</code> <code>sum</code> <code>avg</code>。
      </div>
    </div>
  </div>

  <script src="calc.js"></script>
  <script src="index.js"></script>
</body>
</html>
